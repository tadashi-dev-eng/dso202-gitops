# =============================================================================
# File        : platform/dev/rbac.yaml
# Assignment  : DSO202 Assignment 4 (from Assignment 2, rbac/viewer.yaml)
# Descriptor  : Unit II 2.3 - RBAC (Role, RoleBinding, ServiceAccount)
# Purpose     : Read-only identity for inspection tools in dso202-dev. Secrets
#               are deliberately excluded. Lives in the platform layer because
#               the dso202 project may not create Role or RoleBinding (C8).
#               (Ingress rules from Assignment 2 removed: no Ingress in A4.)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-viewer
  namespace: dso202-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-reader
  namespace: dso202-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-viewer-binding
  namespace: dso202-dev
subjects:
  - kind: ServiceAccount
    name: app-viewer
    namespace: dso202-dev
roleRef:
  kind: Role
  name: app-reader
  apiGroup: rbac.authorization.k8s.io
