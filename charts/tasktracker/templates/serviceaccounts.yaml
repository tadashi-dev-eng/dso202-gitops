{{- /*
=============================================================================
File        : charts/tasktracker/templates/serviceaccounts.yaml
Assignment  : DSO202 Assignment 4 (from Assignment 2/3)
Descriptor  : Unit II 2.3 - ServiceAccounts
Purpose     : One identity per tier. No tier calls the Kubernetes API, so no
              token is mounted.
=============================================================================
*/}}
{{- range $tier := list "frontend" "backend" "db" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tasktracker.fullname" $ }}-{{ $tier }}
  labels:
    {{- include "tasktracker.labels" (dict "ctx" $ "component" $tier) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
